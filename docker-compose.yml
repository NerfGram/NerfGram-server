version: "3.9"
name: telesrv

services:
  postgres:
    image: postgres:17-alpine
    container_name: telesrv-postgres
    # Keep some sane defaults for dev
    command:
      - "postgres"
      - "-c"
      - "max_locks_per_transaction=512"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "track_io_timing=on"
    environment:
      POSTGRES_DB: telesrv
      POSTGRES_USER: telesrv
      POSTGRES_PASSWORD: telesrv
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telesrv -d telesrv"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: telesrv-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6399:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  telesrv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.26
    container_name: telesrv-server
    image: telesrv-server:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TELESRV_LISTEN: "0.0.0.0:2398"
      TELESRV_POSTGRES_DSN: "postgres://telesrv:telesrv@postgres:5432/telesrv?sslmode=disable"
      TELESRV_REDIS_ADDR: "redis:6379"
      TELESRV_BLOB_DIR: "/app/data/blobs"
    volumes:
      - ./data:/app/data
    ports:
      - "2398:2398"
      - "2399:2399"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

